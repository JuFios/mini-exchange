x-test-engine: &test-engine
  restart: 'no'
  ports: !reset []
  volumes: ['./tests/system/fixtures/crash.cjs:/app/system-crash.cjs:ro']
  environment:
    NODE_OPTIONS: --require=/app/system-crash.cjs
    SYSTEM_CRASH_ENABLED: ${SYSTEM_CRASH_ENABLED:-0}
    CHAOS_ENABLED: 'true'
    ADMIN_EMAILS: admin@system.test
    ADMIN_PASSWORD: system-test-password-only
    AUTH_RATE_LIMIT: ${SYSTEM_AUTH_RATE_LIMIT:-1000}
    LOGIN_EMAIL_RATE_LIMIT: ${SYSTEM_LOGIN_EMAIL_RATE_LIMIT:-1000}
    PUBLIC_RATE_LIMIT: ${SYSTEM_PUBLIC_RATE_LIMIT:-100000}
    ORDER_RATE_LIMIT: ${SYSTEM_ORDER_RATE_LIMIT:-1000}
    ORDER_RATE_LIMIT_MIN: ${SYSTEM_ORDER_RATE_LIMIT_MIN:-1000}

services:
  exchange-db:
    restart: 'no'
    ports: !reset []
    volumes: !override ['system-db-data:/var/lib/postgresql/data']
  redis:
    restart: 'no'
    ports: !reset []
    volumes: !override ['system-redis-data:/data']
  matching-engine-1:
    <<: *test-engine
    ports: !reset []
  matching-engine-2:
    <<: *test-engine
    ports: !reset []
  engine-lb:
    restart: 'no'
    ports: !reset []
  settlement-service:
    restart: 'no'
    ports: !reset []
    volumes: ['./tests/system/fixtures/crash.cjs:/app/system-crash.cjs:ro']
    environment:
      NODE_OPTIONS: --require=/app/system-crash.cjs
      SYSTEM_CRASH_ENABLED: ${SYSTEM_CRASH_ENABLED:-0}
      # Коротка пауза дає звірці побачити втрачену угоду без очікування 30 с.
      SETTLEMENT_GRACE_MS: '1000'
  frontend:
    restart: 'no'
  system-tests:
    profiles: [test]
    build:
      context: .
      dockerfile: tests/system/Dockerfile
    volumes: ['/var/run/docker.sock:/var/run/docker.sock']
    environment:
      DATABASE_HOST: exchange-db
      DATABASE_PORT: '5432'
      DATABASE_USER: engine
      DATABASE_PASSWORD: engine-local-only
      DATABASE_NAME: exchange
      LEDGER_DATABASE_USER: ledger
      LEDGER_DATABASE_PASSWORD: ledger-local-only
      LEDGER_DATABASE_NAME: ledger
      ENGINE_URL: http://engine-lb:3001
      ADMIN_EMAIL: admin@system.test
      ADMIN_PASSWORD: system-test-password-only

# Ці томи відокремлені від локальних навіть без зміни імені проєкту.
volumes: !override
  system-db-data:
  system-redis-data:
