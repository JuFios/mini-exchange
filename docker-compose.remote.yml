# Віддалений запуск вимагає власних секретів, бо демо-значення є публічними.
services:
  matching-engine-service:
    ports: !override ['3001:3001']
    environment:
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set a unique JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set a unique JWT_REFRESH_SECRET}

  frontend:
    ports: !override ['3000:3000']
    build:
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?Set NEXT_PUBLIC_WS_URL to the address browsers use}
