# Лише системні тести. Рішення nginx дає змогу відрізнити чергу від повільної відповіді engine.
map $http_x_exchange_test_pulse $write_pulse_log {
  "" 0;
  default 1;
}
log_format write_pulse 'write-pulse $http_x_exchange_test_pulse $limit_req_status $msec $request_time';
access_log /var/log/nginx/access.log write_pulse if=$write_pulse_log;
