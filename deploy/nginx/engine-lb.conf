resolver 127.0.0.11 valid=5s;
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}
# Залишаємо місткість для торгівлі й перевірок стану, навіть якщо решта HTTP-маршрутів зайнята.
map "$request_method:$uri" $engine_rest_scope {
  ~*^(GET|POST|DELETE):/orders(?:/|$) "";
  ~*^GET:/instruments/[^/]+/book/?$ "";
  ~*^GET:/(health|ready|metrics)/?$ "";
  default engine;
}
limit_conn_zone $engine_rest_scope zone=engine_rest:1m;
limit_conn_zone $binary_remote_addr zone=engine_ws_by_ip:1m;

upstream engines {
  zone engines 64k;
  # Таймаут перевантаженого HTTP-запиту не має виводити репліку з ротації для всіх маршрутів.
  server matching-engine-1:3001 resolve max_fails=0;
  server matching-engine-2:3001 resolve max_fails=0;
}
# Ті самі репліки, але з окремим станом збоїв: 503 на upgrade від завислої репліки виводить її
# з ротації лише для WebSocket. REST на ній лишається коректним (читає PG) і не втрачає місткість.
upstream engines_ws {
  zone engines_ws 64k;
  server matching-engine-1:3001 resolve max_fails=1 fail_timeout=5s;
  server matching-engine-2:3001 resolve max_fails=1 fail_timeout=5s;
}

server {
  listen 3001;
  location = /nginx-health { access_log off; return 200 'ok'; }
  # Express не розрізняє регістр і кінцевий `/`, тож точний збіг пропустив би `/Metrics` і `/metrics/`.
  # Лічильники належать конкретній репліці й доступні у внутрішній мережі.
  location ~* ^/(internal|metrics)(/|$) { return 404; }
  location / {
    limit_conn engine_rest 64;
    limit_conn_status 429;
    proxy_pass http://engines;
    proxy_next_upstream error timeout;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
  location /socket.io/ {
    limit_conn engine_ws_by_ip 64;
    limit_conn_status 429;
    proxy_pass http://engines_ws;
    # Репліка, що відстала від stream, відповідає 503 на upgrade: nginx повторює запит на іншій
    # репліці й на fail_timeout виводить її з ротації.
    proxy_next_upstream error timeout http_503;
    proxy_connect_timeout 2s;
    proxy_read_timeout 1h;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

server {
  listen 8080;
  location = /internal/auth/session {
    proxy_pass http://engines;
    proxy_next_upstream error timeout;
    proxy_connect_timeout 1s;
    proxy_read_timeout 1s;
    proxy_next_upstream_tries 2;
    proxy_set_header X-Forwarded-For "";
  }
  location / {
    limit_conn engine_rest 64;
    limit_conn_status 429;
    proxy_pass http://engines;
    proxy_next_upstream error timeout;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
  location /socket.io/ {
    proxy_pass http://engines_ws;
    # Репліка, що відстала від stream, відповідає 503 на upgrade: nginx повторює запит на іншій
    # репліці й на fail_timeout виводить її з ротації.
    proxy_next_upstream error timeout http_503;
    proxy_connect_timeout 2s;
    proxy_read_timeout 1h;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

upstream exchange_frontend {
  zone exchange_frontend 64k;
  server frontend:3000 resolve;
}

server {
  listen 3000;
  # Звірка тримає запит довше за типові 60 с: Node-клієнт frontend чекає відповідь до 300 с,
  # тож nginx дає 310 с і не обриває запит раніше, ніж frontend відповість сам.
  location = /api/settlement/admin/reconciliation {
    proxy_pass http://exchange_frontend;
    proxy_http_version 1.1;
    proxy_read_timeout 310s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port "";
  }
  location / {
    proxy_pass http://exchange_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    # Route Handler отримує одну адресу з ingress, незалежно від заголовків браузера.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port "";
  }
}
