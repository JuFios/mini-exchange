resolver 127.0.0.11 valid=5s;
server_tokens off;
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}
# Залишаємо місткість для торгівлі й перевірок стану, навіть якщо решта HTTP-маршрутів зайнята.
map "$request_method:$uri" $engine_rest_scope {
  ~*^(GET|POST|DELETE):/orders(?:/|$) "";
  ~*^GET:/instruments/[^/]+/book/?$ "";
  ~*^GET:/(health|ready|metrics)/?$ "";
  default engine;
}
limit_conn_zone $engine_rest_scope zone=engine_rest:1m;
# Читання власних заявок не мають межі в engine, а їхня вартість — переважно обробка HTTP.
# Потік від одного клієнта сповільнював заявки інших. Порожній ключ nginx не рахує, тож подання,
# скасування, книга й перевірки стану під ліміти не потрапляють.
map "$request_method:$uri" $orders_read {
  ~*^(GET|HEAD):/orders/book/?$ "";
  ~*^(GET|HEAD):/orders(?:/|$) 1;
  default "";
}
# Ліміт на токен: `sub` без перевірки підпису читати не можна. Ключ — підпис HS256 (43 символи
# base64url) з рядка у формі JWT: однакова довжина ключів не дає підробленим ключам витіснити
# справжні з зони. Регістр слова `Bearer` і пробіли навколо нього нового ключа не дають.
map "$orders_read:$http_authorization" $orders_token_key {
  "~*^1:[ \t]*bearer[ \t]+[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.(?<orders_token>[A-Za-z0-9_-]{43})(?![A-Za-z0-9_.-])" $orders_token;
  default "";
}
# Ліміт на адресу клієнта: підроблений токен чи новий токен після refresh дає новий ключ
# ліміту на токен, але не нову адресу. На `:8080` адресу клієнта передає frontend.
map "$orders_read:$server_port:$exchange_client_address" $orders_client_key {
  "~^1:8080:(?<orders_forwarded>.+)$" $orders_forwarded;
  "~^1:" $remote_addr;
  default "";
}
# Стеля всіх читань заявок на listener. Потік із багатьох адрес і токенів кожен ліміт вище
# обходить, а engine під ~900 читаннями за секунду піднімав медіану заявки з ~20 до ~400 мс.
# Пропущені 440 читань за секунду (обидва listener на стелі) дають ~35 мс. Окремий лічильник на
# listener: потік на публічний `:3001` не забирає квоту терміналу, що читає через `:8080`.
map "$orders_read:$server_port" $orders_listener_key {
  "~^1:(?<orders_port>[0-9]+)$" $orders_port;
  default "";
}
# Подання (у тому числі повтор за `Idempotency-Key`) і скасування заявок. Engine не обмежує
# скасування й завершений повтор, а кожен із них займає спільний ліміт PG: ~950 скасувань за
# секунду від одного користувача піднімали медіану чужої заявки з ~40 мс до ~1,2 с. Ключі ті
# самі, що й для читань, але окремі зони: потік читань не забирає квоту заявок. Стелі на
# listener немає: під потоком з багатьох адрес заявки сповільнюються, а не отримують відмову.
map "$request_method:$uri" $orders_write {
  ~*^(POST|DELETE):/orders(?:/|$) 1;
  default "";
}
map "$orders_write:$http_authorization" $orders_write_token_key {
  "~*^1:[ \t]*bearer[ \t]+[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.(?<orders_write_token>[A-Za-z0-9_-]{43})(?![A-Za-z0-9_.-])" $orders_write_token;
  default "";
}
map "$orders_write:$server_port:$exchange_client_address" $orders_write_client_key {
  "~^1:8080:(?<orders_write_forwarded>.+)$" $orders_write_forwarded;
  "~^1:" $remote_addr;
  default "";
}
limit_req_zone $orders_token_key zone=orders_reads:10m rate=20r/s;
# Половина стелі listener: одна адреса не забирає квоту решти (з лімітом 200 інші адреси під її
# потоком отримували 6 % читань, зі 100 — 95 %).
limit_req_zone $orders_client_key zone=orders_reads_by_client:10m rate=100r/s;
limit_req_zone $orders_listener_key zone=orders_reads_total:64k rate=200r/s;
# Engine приймає 10 нових заявок за секунду на користувача; 20 на токен лишає стільки ж на
# скасування. Запас 100 пропускає одразу скасування сотні заявок, решта — по 20 за секунду.
limit_req_zone $orders_write_token_key zone=orders_writes:10m rate=20r/s;
# Нові токени після refresh чи кілька акаунтів на одній адресі не дають нової квоти. Запас 1000
# не відмовляє сплеску 400 заявок від 20 користувачів з однієї адреси (system concurrency і
# chaos). Одразу проходять лише 200 понад ліміт, решту nginx тримає й видає по 100 за секунду:
# інакше імпульс у 1000 запитів раз на 10 с щоразу піднімав би затримку чужих заявок.
limit_req_zone $orders_write_client_key zone=orders_writes_by_client:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=engine_ws_by_ip:1m;

upstream engines {
  zone engines 64k;
  # Таймаут перевантаженого HTTP-запиту не має виводити репліку з ротації для всіх маршрутів.
  server matching-engine-1:3001 resolve max_fails=0;
  server matching-engine-2:3001 resolve max_fails=0;
}
# Ті самі репліки, але з окремим станом збоїв: 503 на upgrade від завислої репліки виводить її
# з ротації лише для WebSocket. REST на ній лишається коректним (читає PG) і не втрачає місткість.
upstream engines_ws {
  zone engines_ws 64k;
  server matching-engine-1:3001 resolve max_fails=1 fail_timeout=5s;
  server matching-engine-2:3001 resolve max_fails=1 fail_timeout=5s;
}

# Тіло відповідей, які формує сам nginx, у формі помилок engine.
map $status $engine_lb_error {
  400 '{"statusCode":400,"message":"Некоректний запит","error":"Bad Request"}';
  404 '{"statusCode":404,"message":"Маршрут не знайдено","error":"Not Found"}';
  413 '{"statusCode":413,"message":"Тіло запиту завелике","error":"Payload Too Large"}';
  414 '{"statusCode":414,"message":"Адреса запиту задовга","error":"URI Too Long"}';
  502 '{"statusCode":502,"message":"Сервіс тимчасово недоступний","error":"Bad Gateway"}';
  504 '{"statusCode":504,"message":"Сервіс не відповів вчасно","error":"Gateway Timeout"}';
}

server {
  listen 3001;
  default_type application/json;
  if ($exchange_engine_host = 0) { return 421 '{"statusCode":421,"message":"Недовірене ім’я хоста"}'; }
  # Відповіді, які формує nginx (без живої репліки, завелике тіло, задовгі заголовки, внутрішні
  # маршрути), отримують CORS як відповіді engine: інакше браузер бачить мережеву помилку замість
  # статусу. `proxy_intercept_errors` вимкнено, тож відповіді engine з тими самими кодами не
  # змінюються. На рівні server, бо 400 і 414 настають до вибору location. Адреса, а не іменований
  # location: для 414 nginx ще не має URI, а перехід до іменованого location його потребує.
  error_page 400 404 413 414 502 504 /.engine-lb-error;
  # 494 — внутрішній код nginx для задовгого заголовка; клієнт отримує 400.
  error_page 494 =400 /.engine-lb-error;
  error_page 429 @too_many_requests;
  # Healthcheck Compose іде через upstream, як і звичайний запит, але без рядка журналу кожні 5 с.
  location = /health {
    access_log off;
    proxy_pass http://engines;
    proxy_next_upstream error timeout;
    # Обидві спроби вкладаються в 3 с healthcheck: зависла репліка не валить перевірку.
    proxy_connect_timeout 1s;
    proxy_read_timeout 1s;
    proxy_set_header X-Frontend-Proxy "";
    proxy_set_header X-Exchange-Ingress $exchange_ingress_token;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  # Express не розрізняє регістр і кінцевий `/`, тож точний збіг пропустив би `/Metrics` і `/metrics/`.
  # Лічильники належать конкретній репліці й доступні у внутрішній мережі.
  location ~* ^/(internal|metrics|docs)(/|-|$) { return 404; }
  location / {
    limit_conn engine_rest 64;
    limit_conn_status 429;
    # Адресу можуть ділити кілька користувачів за NAT. Повне перечитування терміналів після
    # перепідключення обмежує ще й запас стелі listener (200): решту термінал повторює через 1 с.
    # Спершу адреса: відхилений нею запит не створює вузол у зоні токенів.
    limit_req zone=orders_reads_by_client burst=500 nodelay;
    limit_req zone=orders_reads burst=100 nodelay;
    # Запас у секунду стелі: більший пропустив би на старті потоку ще одну хвилю.
    limit_req zone=orders_reads_total burst=200 nodelay;
    limit_req zone=orders_writes_by_client burst=1000 delay=200;
    limit_req zone=orders_writes burst=100 nodelay;
    limit_req_status 429;
    # Відмову видно в access log зі статусом 429; рядок error log на кожну був би другим потоком.
    limit_req_log_level info;
    proxy_pass http://engines;
    proxy_next_upstream error timeout;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_set_header X-Frontend-Proxy "";
    proxy_set_header X-Exchange-Ingress $exchange_ingress_token;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
  location @too_many_requests {
    default_type application/json;
    add_header Retry-After 1 always;
    # Відповідь формує nginx, а не engine: без CORS браузер на дозволеному origin бачив би
    # мережеву помилку замість 429. Порожнє значення nginx не надсилає.
    add_header Access-Control-Allow-Origin $engine_cors_origin always;
    add_header Access-Control-Expose-Headers Retry-After always;
    add_header Vary Origin always;
    return 429 '{"statusCode":429,"message":"Забагато запитів"}';
  }
  location = /.engine-lb-error {
    internal;
    default_type application/json;
    add_header Access-Control-Allow-Origin $engine_cors_origin always;
    add_header Vary Origin always;
    # Після error_page nginx віддає код початкової помилки, а не код `return`.
    return 200 $engine_lb_error;
  }
  location /socket.io/ {
    limit_conn engine_ws_by_ip 64;
    limit_conn_status 429;
    proxy_pass http://engines_ws;
    # Репліка, що відстала від stream, відповідає 503 на upgrade: nginx повторює запит на іншій
    # репліці й на fail_timeout виводить її з ротації.
    proxy_next_upstream error timeout http_503;
    proxy_connect_timeout 2s;
    proxy_read_timeout 1h;
    proxy_http_version 1.1;
    proxy_set_header X-Frontend-Proxy "";
    proxy_set_header X-Exchange-Ingress $exchange_ingress_token;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

upstream exchange_settlement {
  zone exchange_settlement 64k;
  server settlement-service:3002 resolve;
}

server {
  listen 8080;
  # На рівні server: обробник у location не успадковується сусідніми, а 429 без нього —
  # HTML без `Retry-After`.
  error_page 429 @too_many_requests;
  # Frontend використовує цей listener, а метрики й Swagger потрібні лише у backend-мережі.
  location ~* ^/(metrics|docs)(/|-|$) { return 404; }
  # Frontend ізольований від backend-мережі. Дозволяємо лише наявні маршрути BFF.
  location = /settlement/wallets {
    proxy_pass http://exchange_settlement/wallets;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_set_header X-Frontend-Proxy "";
    proxy_set_header X-Exchange-Ingress "";
    proxy_set_header X-Forwarded-For $exchange_client_address;
  }
  location = /settlement/admin/queue {
    proxy_pass http://exchange_settlement/admin/queue;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_set_header X-Frontend-Proxy "";
    proxy_set_header X-Exchange-Ingress "";
    proxy_set_header X-Forwarded-For $exchange_client_address;
  }
  location = /settlement/admin/reconciliation {
    proxy_pass http://exchange_settlement/admin/reconciliation;
    proxy_connect_timeout 2s;
    proxy_read_timeout 310s;
    proxy_set_header X-Frontend-Proxy "";
    proxy_set_header X-Exchange-Ingress "";
    proxy_set_header X-Forwarded-For $exchange_client_address;
  }
  location /settlement/ { return 404; }
  # Перевірки сесії й ролі для frontend і settlement: короткий таймаут і без ліміту з'єднань.
  location ~ ^/internal/auth/(session|admin)$ {
    proxy_pass http://engines;
    proxy_next_upstream error timeout;
    proxy_connect_timeout 1s;
    proxy_read_timeout 1s;
    proxy_next_upstream_tries 2;
    proxy_set_header X-Frontend-Proxy "";
    proxy_set_header X-Exchange-Ingress $exchange_ingress_token;
    proxy_set_header X-Forwarded-For "";
  }
  # Перевірка ролі для сторінки «Стан системи» в frontend: дедлайн там 1,5 с, тож зависла репліка
  # має поступитися іншій за 1 с, а не за 15 с звичайного маршруту.
  location = /auth/admin {
    # Claims frontend не перевіряє підпис: підроблений cookie з роллю дає цей запит на кожній
    # сторінці. Та сама межа з'єднань, що й для решти маршрутів; 429 frontend вважає «невідомо».
    limit_conn engine_rest 64;
    limit_conn_status 429;
    proxy_pass http://engines;
    proxy_next_upstream error timeout;
    proxy_connect_timeout 1s;
    proxy_read_timeout 1s;
    proxy_next_upstream_tries 2;
    proxy_set_header X-Frontend-Proxy "";
    proxy_set_header X-Exchange-Ingress $exchange_ingress_token;
    proxy_set_header X-Forwarded-For $exchange_client_address;
  }
  location / {
    limit_conn engine_rest 64;
    limit_conn_status 429;
    # Адресу можуть ділити кілька користувачів за NAT. Повне перечитування терміналів після
    # перепідключення обмежує ще й запас стелі listener (200): решту термінал повторює через 1 с.
    # Спершу адреса: відхилений нею запит не створює вузол у зоні токенів.
    limit_req zone=orders_reads_by_client burst=500 nodelay;
    limit_req zone=orders_reads burst=100 nodelay;
    # Запас у секунду стелі: більший пропустив би на старті потоку ще одну хвилю.
    limit_req zone=orders_reads_total burst=200 nodelay;
    limit_req zone=orders_writes_by_client burst=1000 delay=200;
    limit_req zone=orders_writes burst=100 nodelay;
    limit_req_status 429;
    # Відмову видно в access log зі статусом 429; рядок error log на кожну був би другим потоком.
    limit_req_log_level info;
    proxy_pass http://engines;
    proxy_next_upstream error timeout;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_set_header X-Frontend-Proxy "";
    proxy_set_header X-Exchange-Ingress $exchange_ingress_token;
    proxy_set_header X-Forwarded-For $exchange_client_address;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
  location @too_many_requests {
    default_type application/json;
    add_header Retry-After 1 always;
    return 429 '{"statusCode":429,"message":"Забагато запитів"}';
  }
  location /socket.io/ {
    proxy_pass http://engines_ws;
    # Репліка, що відстала від stream, відповідає 503 на upgrade: nginx повторює запит на іншій
    # репліці й на fail_timeout виводить її з ротації.
    proxy_next_upstream error timeout http_503;
    proxy_connect_timeout 2s;
    proxy_read_timeout 1h;
    proxy_http_version 1.1;
    proxy_set_header X-Frontend-Proxy "";
    proxy_set_header X-Exchange-Ingress $exchange_ingress_token;
    proxy_set_header X-Forwarded-For $exchange_client_address;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

upstream exchange_frontend {
  zone exchange_frontend 64k;
  server frontend:3000 resolve;
}

server {
  listen 3000;
  default_type application/json;
  if ($exchange_public_host = 0) { return 421 '{"statusCode":421,"message":"Недовірене ім’я хоста"}'; }
  client_max_body_size 64k;
  error_page 413 = @frontend_payload_too_large;
  location @frontend_payload_too_large {
    return 413 '{"statusCode":413,"message":"Тіло запиту завелике"}';
  }
  # Звірка тримає запит довше за типові 60 с: Node-клієнт frontend чекає відповідь до 300 с,
  # тож nginx дає 310 с і не обриває запит раніше, ніж frontend відповість сам.
  location = /api/settlement/admin/reconciliation {
    proxy_pass http://exchange_frontend;
    proxy_http_version 1.1;
    proxy_read_timeout 310s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Frontend-Proxy "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port "";
  }
  location / {
    proxy_pass http://exchange_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    # Route Handler отримує одну адресу з ingress, незалежно від заголовків браузера.
    proxy_set_header X-Frontend-Proxy "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port "";
  }
}
