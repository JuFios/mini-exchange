# Основна конфігурація образу nginx 1.28 з явною межею з'єднань. Типові 1024 на воркер ділять
# клієнтські й upstream-з'єднання: `delay` у ліміті записів тримає до 800 запитів однієї
# адреси всередині nginx, WebSocket займає по два з'єднання, і кількох таких клієнтів вистачало,
# щоб воркер відмовляв усім.
user  nginx;
worker_processes  auto;
# Удвічі більше за з'єднання: кожне проксійоване має клієнтський і upstream сокет.
worker_rlimit_nofile  16384;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  8192;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
