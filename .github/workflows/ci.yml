name: CI

# Гілки перевіряє `pull_request`; `push` лише для основних гілок, щоб не дублювати прогони.
on:
  push:
    branches: [main, solution]
  pull_request:

permissions:
  contents: read

# Новий коміт у PR скасовує застарілий прогін; прогони основних гілок не скасовуються.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matching-engine-service:
    name: 'Engine: unit + e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: exchange
          POSTGRES_PASSWORD: exchange
          POSTGRES_DB: exchange
        ports: ['127.0.0.1::5432/tcp']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U exchange -d exchange"
          --health-start-period 120s --health-interval 5s --health-timeout 3s --health-retries 24
      redis:
        image: redis:7-alpine
        ports: ['127.0.0.1::6379/tcp']
        options: >-
          --health-cmd "redis-cli -h 127.0.0.1 ping"
          --health-start-period 120s --health-interval 5s --health-timeout 3s --health-retries 24
    defaults:
      run:
        working-directory: apps/matching-engine-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/matching-engine-service/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm test
      - name: Run, revert and reapply engine migrations
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: ${{ job.services.postgres.ports[5432] }}
          DATABASE_USER: exchange
          DATABASE_PASSWORD: exchange
          DATABASE_NAME: exchange
        run: |
          npm run migration:run
          # Один відкат на файл міграції: нова міграція не лишиться без перевірки відкату.
          for _ in $(seq "$(ls src/migrations/*.ts | wc -l)"); do
            npm run migration:revert
          done
          npm run migration:run
      - name: Run engine end-to-end tests
        env:
          DATABASE_PORT: ${{ job.services.postgres.ports[5432] }}
          REDIS_PORT: ${{ job.services.redis.ports[6379] }}
          REDIS_ID: ${{ job.services.redis.id }}
          REDIS_PASSWORD: exchange-redis-local-only
        run: |
          docker exec "$REDIS_ID" redis-cli -e CONFIG SET requirepass "$REDIS_PASSWORD"
          npm run test:e2e
      - name: Diagnose engine service failure
        if: failure()
        env:
          POSTGRES_ID: ${{ job.services.postgres.id }}
          REDIS_ID: ${{ job.services.redis.id }}
        run: |
          for container in "$POSTGRES_ID" "$REDIS_ID"; do
            [ -n "$container" ] || continue
            docker inspect --format '{{json .State.Health}}' "$container" || true
            docker logs --tail=200 "$container" || true
          done

  settlement-service:
    name: 'Settlement: unit + e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger
        ports: ['127.0.0.1::5432/tcp']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ledger -d ledger"
          --health-start-period 120s --health-interval 5s --health-timeout 3s --health-retries 24
      redis:
        image: redis:7-alpine
        ports: ['127.0.0.1::6379/tcp']
        options: >-
          --health-cmd "redis-cli -h 127.0.0.1 ping"
          --health-start-period 120s --health-interval 5s --health-timeout 3s --health-retries 24
    defaults:
      run:
        working-directory: apps/settlement-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/settlement-service/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm test
      - name: Run ledger migrations and settlement end-to-end tests
        env:
          LEDGER_DATABASE_HOST: 127.0.0.1
          LEDGER_DATABASE_PORT: ${{ job.services.postgres.ports[5432] }}
          LEDGER_DATABASE_USER: ledger
          LEDGER_DATABASE_PASSWORD: ledger
          LEDGER_DATABASE_NAME: ledger
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: ${{ job.services.redis.ports[6379] }}
          REDIS_ID: ${{ job.services.redis.id }}
          REDIS_PASSWORD: exchange-redis-local-only
        run: |
          docker exec "$REDIS_ID" redis-cli -e CONFIG SET requirepass "$REDIS_PASSWORD"
          npm run migration:run
          for _ in src/migrations/*.ts; do
            npm run migration:revert
          done
          npm run migration:run
          npm run test:e2e
      - name: Diagnose settlement service failure
        if: failure()
        env:
          POSTGRES_ID: ${{ job.services.postgres.id }}
          REDIS_ID: ${{ job.services.redis.id }}
        run: |
          for container in "$POSTGRES_ID" "$REDIS_ID"; do
            [ -n "$container" ] || continue
            docker inspect --format '{{json .State.Health}}' "$container" || true
            docker logs --tail=200 "$container" || true
          done

  frontend:
    name: 'Frontend: lint, unit, build'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose-smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENGINE_PUBLIC_WS_URL: wss://exchange.example.test
    steps:
      - uses: actions/checkout@v4
      - name: Verify the local and remote port bindings
        run: scripts/ci/check-compose-bindings.sh
      - name: Verify trusted ingress forwarding and spoof protection
        run: scripts/ci/check-trusted-ingress.sh
      - name: Verify recovery and access isolation for PostgreSQL bootstrap
        run: scripts/ci/check-postgres-bootstrap.sh
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Verify the frontend address and Redis port
        run: |
          for service in postgres-bootstrap engine-migrate settlement-migrate; do
            test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps -a -q "$service")")" = 0
          done
          curl -fsS http://127.0.0.1:3000/api/config | jq -e --arg url "$ENGINE_PUBLIC_WS_URL" '.wsUrl == $url'
          docker inspect --format '{{json .HostConfig.PortBindings}}' "$(docker compose ps -q redis)" |
            jq -e '(. // {}) == {}'
          docker compose exec -T redis sh -ec 'test "$(awk "/^Uid:/ { print \$2 }" /proc/1/status)" -ne 0'
      - name: Verify Redis volume migration
        run: scripts/ci/check-redis-migration.sh
      - name: Diagnose failure
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail=200
      - name: Remove smoke containers and volumes
        if: always()
        run: docker compose down -v --remove-orphans


  system:
    name: System tests
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/solution'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: exchange-system-${{ github.run_id }}
      COMPOSE_FILE: docker-compose.yml:docker-compose.test.yml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and check the system runner
        run: |
          docker compose build system-tests
          docker compose run --rm --no-deps system-tests sh -ec 'npm run format:check && npm run typecheck && npm test'
      - name: Start isolated system stack with production auth limits
        env:
          SYSTEM_AUTH_RATE_LIMIT: '10'
          SYSTEM_LOGIN_EMAIL_RATE_LIMIT: '10'
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Check frontend auth limits and trusted ingress
        run: docker compose run --rm --no-deps system-tests npm run rate-limit
      - name: Restore system load limits
        run: |
          docker compose up -d --wait --wait-timeout 240 matching-engine-1 matching-engine-2
          docker compose up -d --wait --force-recreate --no-deps engine-lb
      - name: Check trace propagation, redaction and Redis authentication
        run: docker compose run --rm --no-deps system-tests npm run trace
      - name: Check session revocation across HTTP and WebSocket
        run: docker compose run --rm --no-deps system-tests npm run session:revocation
      - name: Check WebSocket transport through both listeners
        run: docker compose run --rm system-tests npm run realtime:transport
      - name: Check graceful ownership transfer
        run: docker compose run --rm system-tests npm run chaos:sigterm
      - name: Check ownership after a crash
        run: docker compose run --rm system-tests npm run ownership:kill
      - name: Check crashes before and after commit
        run: docker compose run --rm system-tests npm run ownership:hooks
      - name: Check takeover when the owner loses PostgreSQL silently
        run: docker compose run --rm system-tests npm run ownership:blackhole
      - name: Check settlement recovery after a lost stream
        run: docker compose run --rm system-tests npm run settlement:redrive
      - name: Check wallet push to the private WebSocket
        run: docker compose run --rm system-tests npm run wallet:push
      - name: Check the order sync recipe for the private WebSocket
        run: docker compose run --rm system-tests npm run orders:sync
      - name: Run concurrency, chaos and reconnect against fresh stacks
        run: bash tests/system/run-fresh.sh
      - name: Reproduce starter failures and compare lease recovery
        run: bash tests/system/run-baseline.sh
      - name: Diagnose failure before cleanup
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail=200
      - name: Remove system containers and volumes
        if: always()
        run: docker compose down -v --remove-orphans
