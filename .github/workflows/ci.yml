name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  matching-engine-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/matching-engine-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/matching-engine-service/package-lock.json
      - run: npm ci
      - run: npm run lint:check
      - run: npx tsc --noEmit
      - run: npm test
      - run: node ../../scripts/audit-production.cjs

  settlement-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/settlement-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/settlement-service/package-lock.json
      - run: npm ci
      - run: npm run lint:check
      - run: npx tsc --noEmit
      - run: node ../../scripts/audit-production.cjs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: node ../../scripts/audit-production.cjs

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Diagnose failure
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail=200
      - name: Remove smoke containers and volumes
        if: always()
        run: docker compose down -v --remove-orphans
