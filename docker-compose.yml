x-redis-password: &redis-password ${REDIS_PASSWORD:-exchange-redis-local-only}
x-tracing-environment: &tracing-environment
  OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}

x-engine: &engine
  init: true
  # Без перезапуску впала репліка не повертається, і резерв лишається єдиним.
  restart: unless-stopped
  build: &engine-build ./apps/matching-engine-service
  env_file: ./apps/matching-engine-service/.env.example
  environment: &engine-environment
    <<: *tracing-environment
    DATABASE_HOST: exchange-db
    REDIS_HOST: redis
    REDIS_PASSWORD: *redis-password
  depends_on:
    engine-migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  healthcheck:
    test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/ready']
    interval: 5s
    timeout: 5s
    retries: 10
    start_period: 120s

services:
  exchange-db:
    restart: unless-stopped
    image: postgres:16-alpine
    env_file: ./docker/postgres/.env.example
    environment:
      POSTGRES_USER: exchange
      POSTGRES_DB: postgres
    ports: ['127.0.0.1:5433:5432']
    volumes: ['exchange-db-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 120s

  postgres-bootstrap:
    image: postgres:16-alpine
    restart: 'on-failure:3'
    env_file: ./docker/postgres/.env.example
    command: ['sh', '/bootstrap/01-init.sh']
    volumes: ['./docker/postgres/init/01-init.sh:/bootstrap/01-init.sh:ro']
    depends_on:
      exchange-db:
        condition: service_healthy

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    environment:
      REDISCLI_AUTH: *redis-password
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$$REDISCLI_AUTH"
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -h 127.0.0.1 ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 10
      # Невдалі перевірки не враховуються, поки Redis відтворює AOF.
      start_period: ${REDIS_HEALTH_START_PERIOD:-120s}
      start_interval: 1s

  engine-migrate:
    build: *engine-build
    env_file: ./apps/matching-engine-service/.env.example
    environment:
      DATABASE_HOST: exchange-db
    command: ['node', 'dist/migrate', 'run']
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully

  matching-engine-1:
    <<: *engine
    environment:
      <<: *engine-environment
      INSTANCE_ID: engine-1

  matching-engine-2:
    <<: *engine
    environment:
      <<: *engine-environment
      INSTANCE_ID: engine-2

  engine-lb:
    restart: unless-stopped
    image: nginx:1.28.0-alpine
    volumes: ['./deploy/nginx/engine-lb.conf:/etc/nginx/conf.d/default.conf:ro']
    ports: ['127.0.0.1:3001:3001', '127.0.0.1:3000:3000']
    depends_on:
      matching-engine-1:
        condition: service_healthy
      matching-engine-2:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/nginx-health']
      interval: 5s
      timeout: 3s
      retries: 10

  settlement-migrate:
    build: &settlement-build ./apps/settlement-service
    env_file: ./apps/settlement-service/.env.example
    command: ['node', 'dist/migrate', 'run']
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully

  settlement-service:
    init: true
    restart: unless-stopped
    build: *settlement-build
    env_file: ./apps/settlement-service/.env.example
    environment:
      <<: *tracing-environment
      REDIS_PASSWORD: *redis-password
    depends_on:
      settlement-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports: ['127.0.0.1:3002:3002']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3002/ready']
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    restart: unless-stopped
    build: ./apps/frontend
    env_file: ./apps/frontend/.env.example
    environment:
      MATCHING_ENGINE_URL: http://engine-lb:8080
      ENGINE_PUBLIC_WS_URL: ${ENGINE_PUBLIC_WS_URL:-${NEXT_PUBLIC_WS_URL:-ws://localhost:3001}}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  exchange-db-data:
  redis-data:
